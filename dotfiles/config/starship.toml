"$schema" = "https://starship.rs/config-schema.json"

# Minimal two-line prompt matched to Ghostty's Cobalt2 theme.
add_newline = false
palette = "cobalt2"
format = """$username$hostname$directory$nodejs$bun$deno$python$rust$golang$ruby$git_branch$git_status$line_break$character"""
right_format = ""

[palettes.cobalt2]
blue = "#0088ff"
cyan = "#6ae3fa"
yellow = "#ffc600"
green = "#3ad900"
red = "#ff2600"
foreground = "#ffffff"
dimmed = "#9ca9b3"

# Appears for SSH sessions (and for root, per Starship's built-in behavior).
[username]
show_always = false
style_user = "dimmed"
style_root = "red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "dimmed"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
read_only = " (read-only)"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 1
truncate_to_repo = true
truncation_symbol = ""
home_symbol = "~"

# Show detected runtime names and versions.
[nodejs]
symbol = "node"
format = "  [$symbol $version](yellow)"

[bun]
symbol = "bun"
format = "  [$symbol $version](yellow)"

[deno]
symbol = "deno"
format = "  [$symbol $version](yellow)"

[python]
symbol = "python"
format = "  [$symbol $version](yellow)"

[rust]
symbol = "rust"
format = "  [$symbol $version](yellow)"

[golang]
symbol = "go"
format = "  [$symbol $version](yellow)"

[ruby]
symbol = "ruby"
format = "  [$symbol $version](yellow)"

# Together these render as: [branch + ?]
[git_branch]
style = "cyan"
format = '  [\[$branch]($style)'
truncation_length = 32
truncation_symbol = "..."

[git_status]
format = '[$all_status$ahead_behind](cyan)[\]](cyan)'
conflicted = " ="
ahead = " >${count}"
behind = " <${count}"
diverged = " <>${ahead_count}/${behind_count}"
untracked = " ?"
stashed = " s"
modified = " !"
staged = " +"
renamed = " r"
deleted = " x"

[character]
success_symbol = "[->](bold green)"
error_symbol = "[->](bold green)"
