name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck Pi extensions
        run: npm run typecheck:pi
      - name: Check shell syntax
        run: for f in dot scripts/*.sh .githooks/pre-commit home/.local/bin/pi; do bash -n "$f"; done
      - name: Run shellcheck
        run: shellcheck -S warning dot scripts/*.sh home/.local/bin/pi
