name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    name: dot setup on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up and check a fresh container headlessly
        run: tests/linux/run.sh './dot --headless setup' './dot --headless check' './dot --headless setup' './dot check'
      - name: Headless setup fails fast when sudo needs a password
        env:
          DOT_LINUX_TEST_SUDO: password
        run: >-
          tests/linux/run.sh
          'if timeout 300 ./dot --headless setup >/tmp/dot.log 2>&1; then cat /tmp/dot.log; exit 1; fi;
          cat /tmp/dot.log; grep -q "sudo needs a password" /tmp/dot.log'
