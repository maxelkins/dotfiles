name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    name: dot setup on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up and check a fresh container
        run: tests/linux/run.sh
