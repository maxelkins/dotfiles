onboarding = false
[theme]
# Use the terminal palette as the base, then apply explicit Cobalt2 overrides.
name = "terminal"
auto_switch = false

[theme.custom]
accent = "#6ae3fa"
panel_bg = "#18354f"
sidebar_bg = "#132738"
active_row_bg = "#18354f"
selection_bg = "#214b68"
surface0 = "#172f43"
surface1 = "#214b68"
surface_dim = "#102331"
overlay0 = "#61798b"
overlay1 = "#9ca9b3"
text = "#ffffff"
subtext0 = "#9ca9b3"
mauve = "#ff005d"
green = "#3ad900"
yellow = "#ffc600"
red = "#ff2600"
blue = "#0088ff"
teal = "#00bbbb"
peach = "#ff9d00"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#ffffff", dim = true }],
  [{ token = "agent", fg = "#ffffff", dim = true }],
]

[keys]
# Ctrl+Backslash enters Herdr prefix mode.
prefix = "ctrl+backslash"

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

# Terminal annotations
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

# Document review (plannotator-tui)
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"